spring.datasource.url=jdbc:postgresql://localhost:5432/restaurant_test
spring.datasource.username=${TEST_DB_USERNAME:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.jpa.show-sql=false

stripe.api.key=sk_test_dummy
stripe.webhook.secret=whsec_dummy
stripe.success.url=http://localhost:8080/checkout/success
stripe.cancel.url=http://localhost:8080/checkout/failure

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=1000
spring.mail.properties.mail.smtp.timeout=1000
spring.mail.properties.mail.smtp.writetimeout=1000
receipt.from.address=test@example.com