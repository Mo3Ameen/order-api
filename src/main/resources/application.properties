# Values come from the environment. Format: ${VARIABLE:default}
# Secrets have NO default on purpose - the app refuses to start
# rather than booting with a wrong value and failing later.
# Local development: put real values in config/application.properties (gitignored).

spring.application.name=order-api

# --- Database ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/restaurant}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
# Let Hibernate manage your tables based on your @Entity classes
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
# Tells Spring to always run schema.sql on startup
spring.sql.init.mode=always
#Tells Spring, If you try to insert this data, but it's already in the database, just ignore the error and keep running the app
spring.sql.init.continue-on-error=true
# See the actual SQL Hibernate generates (great for learning/debugging)
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}

# --- Mail (MailHog by default: http://localhost:8025) ---
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
# On Gmail this must equal spring.mail.username exactly
receipt.from.address=${RECEIPT_FROM_ADDRESS:noreply@example.com}

# --- Stripe ---
stripe.api.key=${STRIPE_API_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}
stripe.success.url=${STRIPE_SUCCESS_URL:http://localhost:8080/checkout/success}
stripe.cancel.url=${STRIPE_CANCEL_URL:http://localhost:8080/checkout/failure}