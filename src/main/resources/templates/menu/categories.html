<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Menu</title>
</head>
<body>
    <h1>Menu</h1>
    <ul>
        <li th:each="category : ${categories}">
            <a th:href="@{/menu/categories/{id}(id=${category.id})}"
                th:text="${category.name}">Category name</a>
        </li>
    </ul>
</body>
</html>
